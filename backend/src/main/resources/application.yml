spring:
  application:
    name: polimarket
  datasource:
    url: ${POLIMARKET_DB_URL:jdbc:postgresql://localhost:5432/polimarket}
    username: ${POLIMARKET_DB_USER:polimarket}
    password: ${POLIMARKET_DB_PASSWORD:polimarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway; Hibernate solo comprueba
  flyway:
    enabled: true
    locations: classpath:db/migration

polimarket:
  demo:
    cargar-datos: true       # carga datos ficticios la primera vez (cuentas, productos, clientes). Poner false para una base vacía
    clave: Demo-1234         # clave ficticia de las cuentas de demostración

# Documentación interactiva de la API: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true          # Swagger UI lee la cookie XSRF-TOKEN y manda X-XSRF-TOKEN en las escrituras
    tags-sorter: alpha
    operations-sorter: method

server:
  servlet:
    session:
      timeout: 30m
