spring:
  application:
    name: polimarket
  datasource:
    url: ${POLIMARKET_DB_URL:jdbc:postgresql://localhost:5432/polimarket}
    username: ${POLIMARKET_DB_USER:polimarket}
    password: ${POLIMARKET_DB_PASSWORD:polimarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway; Hibernate solo comprueba
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 30m
