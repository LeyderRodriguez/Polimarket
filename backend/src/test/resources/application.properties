# Solo para las pruebas: BCrypt con el costo mínimo para que cada hash y cada inicio de sesión sean casi instantáneos.
polimarket.seguridad.costo-bcrypt=4

# Las pruebas crean sus propios datos: no se cargan los de demostración (CargadorDatosDemoTest sí los pide).
polimarket.demo.cargar-datos=false

# Solo se comprueba el contrato de la API, sin la página de Swagger UI.
springdoc.swagger-ui.enabled=false
