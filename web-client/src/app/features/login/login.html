<div class="login">
  <div class="esquina"><app-selector-tema /></div>
  <div class="tarjeta">
    <app-aviso-error [error]="errorServidor()" />
    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <div>
        <h1>Iniciar sesión</h1>
        <p class="sub">Vendedores y personal de entregas</p>
      </div>

      <label class="f">
        <span>Correo</span>
        <input
          id="correo"
          type="email"
          formControlName="correo"
          autocomplete="username"
          [attr.aria-invalid]="invalido('correo')"
        />
        @if (invalido('correo')) {
          <span class="campo-error">Escriba un correo válido.</span>
        }
      </label>

      <label class="f">
        <span>Contraseña</span>
        <input
          id="contrasena"
          type="password"
          formControlName="contrasena"
          autocomplete="current-password"
          [attr.aria-invalid]="invalido('contrasena')"
        />
        @if (invalido('contrasena')) {
          <span class="campo-error">Escriba su contraseña.</span>
        }
      </label>

      <app-aviso-error [error]="error()" />

      <button class="btn primary" type="submit" [disabled]="enCurso()">
        {{ enCurso() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <section class="demo" aria-label="Cuentas de demostración">
      <p class="sub">Cuentas de demostración: elija una y pulse Entrar.</p>

      <div class="grupo" data-cliente="web">
        <span class="grupo-titulo">Para este cliente web</span>
        <div class="demo-botones">
          @for (cuenta of cuentasWeb; track cuenta.correo) {
            <button type="button" class="chip" [title]="cuenta.detalle" (click)="usarCuenta(cuenta)">
              {{ cuenta.etiqueta }}
            </button>
          }
        </div>
      </div>

      <div class="grupo" data-cliente="escritorio">
        <span class="grupo-titulo">Del cliente de escritorio <small>(aquí se rechazan)</small></span>
        <div class="demo-botones">
          @for (cuenta of cuentasEscritorio; track cuenta.correo) {
            <button type="button" class="chip escritorio" [title]="cuenta.detalle" (click)="usarCuenta(cuenta)">
              {{ cuenta.etiqueta }}
            </button>
          }
        </div>
      </div>
    </section>
  </div>
</div>
